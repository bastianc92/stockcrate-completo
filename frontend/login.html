<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StockCrate - Iniciar sesión</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    />
    <link rel="stylesheet" href="css/estilos.css" />
    <style>
      /* Estilos propios del login, esta página no usa el sidebar */
      body {
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #dbe7fb 0%, #efe3f7 100%);
      }

      .login-wrapper {
        width: 100%;
        max-width: 400px;
        padding: 24px;
      }

      .login-card {
        background: #ffffff;
        border-radius: 16px;
        padding: 44px 40px;
        box-shadow: 0 20px 50px rgba(80, 100, 160, 0.15);
      }

      .login-brand {
        text-align: center;
        margin-bottom: 28px;
      }

      .login-brand .brand-name {
        font-size: 24px;
        font-weight: 700;
        color: var(--accent-text);
      }

      .login-brand .brand-sub {
        font-size: 13px;
        color: var(--text-soft);
        margin-top: 4px;
      }

      .login-title {
        font-size: 16px;
        font-weight: 600;
        margin-bottom: 24px;
        text-align: center;
      }

      .login-group {
        margin-bottom: 16px;
      }

      .btn-login {
        width: 100%;
        justify-content: center;
        padding: 12px;
        font-size: 15px;
        margin-top: 8px;
      }

      .login-error {
        display: none;
        background: var(--danger-light);
        color: var(--danger-text);
        border-radius: 8px;
        padding: 10px 14px;
        font-size: 13px;
        margin-bottom: 16px;
        text-align: center;
      }

      .login-error.visible {
        display: block;
      }

      .login-footer {
        text-align: center;
        margin-top: 24px;
        font-size: 12px;
        color: var(--text-muted);
      }
    </style>
  </head>
  <body>
    <div class="login-wrapper">
      <div class="login-card">
        <div class="login-brand">
          <div class="brand-name">StockCrate</div>
          <div class="brand-sub">Sistema de Gestión de Inventarios</div>
        </div>

        <div class="login-title">Iniciar sesión</div>

        <div class="login-error" id="login-error" role="alert"></div>

        <!-- Uso un form de verdad para que Enter funcione y el navegador
             pueda guardar la contraseña -->
        <form id="form-login">
          <div class="form-group login-group">
            <label class="form-label" for="correo">Correo electrónico</label>
            <input
              type="email"
              id="correo"
              class="form-control"
              placeholder="admin@stockcrate.com"
              autocomplete="email"
            />
          </div>

          <div class="form-group login-group">
            <label class="form-label" for="password">Contraseña</label>
            <input
              type="password"
              id="password"
              class="form-control"
              placeholder="Tu contraseña"
              autocomplete="current-password"
            />
          </div>

          <button
            type="submit"
            class="btn btn-primary btn-login"
            id="btn-entrar"
          >
            Entrar
          </button>
        </form>

        <div class="login-footer">Versión 1.0</div>
      </div>
    </div>

    <script>
      const API_URL = "http://localhost:5000/api";

      // El inicio de sesión se valida en el backend Flask.
      const USAR_BACKEND = true;

      // Si ya hay sesión no tiene sentido mostrar el login otra vez
      if (localStorage.getItem("sesion")) {
        window.location.href = "index.html";
      }

      function mostrarError(texto) {
        const error = document.getElementById("login-error");
        error.textContent = texto;
        error.classList.add("visible");
      }

      // Devuelve los datos de la sesión o null si las credenciales no sirven
      async function validarCredenciales(correo, password) {
        if (USAR_BACKEND) {
          // Se espera una respuesta tipo { token, correo, nombre, rol }
          const respuesta = await fetch(API_URL + "/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ correo, password }),
          });
          if (!respuesta.ok) return null;
          return await respuesta.json();
        }

        return null; // No se permiten credenciales locales de prueba.
      }

      document
        .getElementById("form-login")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          const correo = document.getElementById("correo").value.trim();
          // A la contraseña no le hago trim, tal cual la escribió el usuario
          const password = document.getElementById("password").value;
          const boton = document.getElementById("btn-entrar");

          if (!correo || !password) {
            mostrarError("Por favor completa todos los campos.");
            return;
          }

          boton.disabled = true;
          try {
            const datos = await validarCredenciales(correo, password);
            if (!datos) {
              mostrarError("Usuario o contraseña incorrectos.");
              document.getElementById("password").value = "";
              document.getElementById("password").focus();
              return;
            }
            localStorage.setItem("sesion", JSON.stringify(datos));
            window.location.href = "index.html";
          } catch (error) {
            mostrarError("No se pudo conectar con el servidor.");
          } finally {
            boton.disabled = false;
          }
        });
    </script>
  </body>
</html>
